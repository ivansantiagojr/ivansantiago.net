{% extends "base.html" %} 

{% block head %}
    <title>{{ section.title }}</title>
{% endblock head %} 

{% block content %}
    <main class="container">
        <section class="blog-listing">
            <h1>Blog do Ivan</h1>
            {% for post in section.pages %}
                <article>
                    <a href="{{ post.url }}">
                        <h4>
                            {{ post.title }}
                        </h4>
                    </a>
                    <p>{{ post.extra.summary }}</p>
                </article>
            {% endfor %}
        </section>
    </main>
{% endblock content %}
